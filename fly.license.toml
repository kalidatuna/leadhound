app = "leadhound-license-nino"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.license"

[env]
  PORT = "8080"
  TRUST_PROXY = "1"
  LICENSE_DB = "/data/licenses.db"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
