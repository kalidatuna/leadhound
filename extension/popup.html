<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
:root{color-scheme:light dark;--bg:#f6f3ea;--card:#fdfcf8;--ink:#13261f;--mut:#56685f;--hair:#ddd8c9;--pri:#174a37;--on:#f6f3ea;--gold:#d3ac57}
@media(prefers-color-scheme:dark){:root{--bg:#101b17;--card:#16241f;--ink:#eeeadf;--mut:#a3b3aa;--hair:#2c3d36;--pri:#7cc3a2;--on:#10201a}}
body{margin:0;width:300px;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{display:flex;align-items:center;gap:10px;font:500 18px/1 Georgia,serif;margin:0 0 6px}h1 img{width:26px;height:26px}
p{margin:0 0 12px;color:var(--mut)}.page{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
button{display:block;width:100%;min-height:40px;margin:0 0 8px;border:0;border-radius:99px;font:600 14px system-ui,sans-serif;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
button.pri{background:var(--pri);color:var(--on);box-shadow:none}button:hover{box-shadow:inset 0 0 0 1px var(--gold)}
label{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--mut);font-size:12.5px}
input{width:72px;padding:4px 8px;border-radius:8px;border:1px solid var(--hair);background:var(--card);color:var(--ink)}
small{display:block;margin-top:10px;color:var(--mut);font-size:12px}
</style></head><body>
<h1><img src="icons/48.png" alt="">leadhound</h1>
<p id="page" class="page"></p>
<button id="save" class="pri">Save this page as a lead</button>
<button id="check">Check this website</button>
<p>Select the post's text first to include it.</p>
<label>leadhound runs on port <input id="port" type="number" min="1" max="65535" value="8787"></label>
<small>Opens leadhound on this computer with the form filled in. You confirm there. Nothing is sent anywhere else.</small>
<script src="popup.js"></script>
</body></html>
