name: release
# Runs when a GitHub release is published (or by hand). Builds the downloadable apps, the Docker
# image, and publishes to PyPI with trusted publishing (no token stored anywhere).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.3.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  apps:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # upload files to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, ext: "" }
          - { os: windows-latest, name: windows-x86_64, ext: ".exe" }
          - { os: macos-latest, name: macos-arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller .
      - name: Build
        run: pyinstaller --onefile --name leadhound --collect-data leadhound --collect-submodules leadhound packaging/run.py
      - name: Smoke test
        shell: bash
        run: ./dist/leadhound${{ matrix.ext }} --version
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../leadhound-${{ matrix.name }}.zip" "leadhound.exe"
          else
            zip "../leadhound-${{ matrix.name }}.zip" leadhound
          fi
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "leadhound-${{ matrix.name }}.zip" --clobber

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kalidatuna/leadhound:latest
            ghcr.io/kalidatuna/leadhound:${{ env.TAG }}

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
