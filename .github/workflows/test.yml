name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t tests -v
      - run: pip install . && leadhound --version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check app JavaScript syntax
        run: for f in leadhound/dashboard/*.js; do node --check --input-type=module < $f; done

  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run install.sh with this checkout
        if: runner.os != 'Windows'
        env:
          LEADHOUND_NO_START: "1"
          LEADHOUND_SOURCE: ${{ github.workspace }}
        run: sh install.sh && ~/.local/bin/leadhound --version
      - name: Run install.ps1 with this checkout
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LEADHOUND_NO_START: "1"
          LEADHOUND_SOURCE: ${{ github.workspace }}
        run: |
          ./install.ps1
          & "$env:USERPROFILE\.leadhound\bin\leadhound.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leadhound .
      - name: Cloud mode serves the sign-in page and protects the API
        run: |
          docker run -d --name lh -p 8787:8787 -e LEADHOUND_PASSWORD=ci-test-password leadhound
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/ | grep -q login.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/meta)" = 401
          docker logs lh
