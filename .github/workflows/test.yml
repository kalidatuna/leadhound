name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t tests -v
      - run: pip install . && leadhound --version
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check app JavaScript syntax
        run: for f in leadhound/dashboard/*.js; do node --check --input-type=module < $f; done
