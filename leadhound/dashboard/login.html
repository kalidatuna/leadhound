<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>leadhound · sign in</title>
<link rel="stylesheet" href="/static/app.css">
</head><body class="login">
<div class="dialog" role="main">
  <div class="brand">leadhound</div>
  <h2 id="l-title">Sign in</h2>
  <label class="f" for="pw" id="l-label">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <p id="err" class="bad" hidden></p>
  <div class="row" style="margin-top:14px"><button id="go" class="btn primary">Sign in</button></div>
</div>
<script type="module" src="/static/login.js"></script>
</body></html>
