[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leadhound"
version = "0.3.1"
description = "Find freelance clients worldwide: live hiring posts, Freelancer.com projects, paid issues and local businesses with weak websites. 11 languages, local-first, zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kalidatuna" }]
keywords = ["freelance", "leads", "clients", "lead-generation", "website-audit", "openstreetmap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Office/Business",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kalidatuna/leadhound"
Issues = "https://github.com/kalidatuna/leadhound/issues"

[project.scripts]
leadhound = "leadhound.cli:main"

[tool.setuptools]
packages = ["leadhound", "leadhound.sources", "leadhound.dashboard", "leadhound.i18n"]

[tool.setuptools.package-data]
"leadhound.dashboard" = ["*.html", "*.css", "*.js", "locales/*.json"]
